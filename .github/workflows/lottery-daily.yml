name: Lottery Daily Cycle

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Enviar correo SMTP de prueba a coremprejair@gmail.com"
        required: false
        type: boolean
        default: false

jobs:
  run-daily:
    runs-on: ${{ vars.LOTTERY_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: uv run pytest -q

      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: |
            data/
            models/
            predictions/
          key: lottery-pipeline-state-${{ github.run_id }}
          restore-keys: |
            lottery-pipeline-state-

      - name: Show historical coverage
        env:
          PYTHONPATH: src
        run: |
          uv run python -c "import sqlite3; c=sqlite3.connect('data/lottery.db'); print(c.execute('SELECT COUNT(*), MIN(draw_date), MAX(draw_date) FROM official_results').fetchone())"

      - name: Validate official API schema
        run: |
          uv run python -c "import requests; r=requests.get('https://www.datos.gov.co/resource/i3kx-3zps.json', params={'$limit': 1}, timeout=30); r.raise_for_status(); row=r.json()[0]; print(sorted(row)); print({k: row[k] for k in row if k in {'fecha','loter_a','n_mero','numero','tipo_de_premio'}})"

      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        env:
          PYTHONPATH: src
          LOTTERY_SMTP_HOST: ${{ secrets.LOTTERY_SMTP_HOST }}
          LOTTERY_SMTP_PORT: ${{ secrets.LOTTERY_SMTP_PORT }}
          LOTTERY_SMTP_USERNAME: ${{ secrets.LOTTERY_SMTP_USERNAME }}
          LOTTERY_SMTP_PASSWORD: ${{ secrets.LOTTERY_SMTP_PASSWORD }}
          LOTTERY_SMTP_SENDER: ${{ secrets.LOTTERY_SMTP_SENDER }}
          LOTTERY_ALERT_RECIPIENT: coremprejair@gmail.com
        run: uv run python -m lottery_pipeline test-email --recipient coremprejair@gmail.com

      - name: Run daily cycle
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        env:
          PYTHONPATH: src
          LOTTERY_SMTP_HOST: ${{ secrets.LOTTERY_SMTP_HOST }}
          LOTTERY_SMTP_PORT: ${{ secrets.LOTTERY_SMTP_PORT }}
          LOTTERY_SMTP_USERNAME: ${{ secrets.LOTTERY_SMTP_USERNAME }}
          LOTTERY_SMTP_PASSWORD: ${{ secrets.LOTTERY_SMTP_PASSWORD }}
          LOTTERY_SMTP_SENDER: ${{ secrets.LOTTERY_SMTP_SENDER }}
          LOTTERY_ALERT_RECIPIENT: ${{ secrets.LOTTERY_ALERT_RECIPIENT }}
        run: |
          uv run python -m lottery_pipeline init-db --db-path data/lottery.db
          uv run python -m lottery_pipeline run-cycle --db-path data/lottery.db --frequency all --limit 50000 --min-rows 30

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-daily-artifacts
          path: |
            data/
            models/
            predictions/
